<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify a Certified Transcript | Else School of Management</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Open Sans', sans-serif; background: #f5f5f7; color: #1a1a2e; }
header { background: linear-gradient(135deg, #21145F, #3a2d7a); color: #fff; padding: 14px 24px; display: flex; align-items: center; }
header img { height: 36px; margin-right: 14px; }
header h1 { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; }
main { max-width: 900px; margin: 24px auto; padding: 0 16px 60px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(33,20,95,0.08); padding: 20px 22px; margin-bottom: 16px; }
.card h2 { font-family: 'Cormorant Garamond', serif; color: #21145F; font-size: 1.3rem; margin-bottom: 10px; }
label { display: block; font-size: 0.78rem; font-weight: 700; color: #21145F; margin: 8px 0 4px; }
input { width: 100%; padding: 10px 12px; border: 2px solid #e0e0e6; border-radius: 8px; font-size: 0.95rem; font-family: inherit; }
input:focus { border-color: #21145F; outline: none; }
button { background: #21145F; color: #fff; border: none; border-radius: 30px; padding: 10px 24px; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 14px; font-family: inherit; }
button.secondary { background: transparent; color: #21145F; border: 1.5px solid #21145F; margin-left: 8px; }
.small { font-size: 0.76rem; color: #75787B; margin-top: 6px; }
.banner { border-radius: 12px; padding: 18px 22px; margin-bottom: 16px; display: flex; align-items: center; }
.banner .icon { font-size: 2.2rem; margin-right: 16px; }
.banner.ok { background: #e8f5ee; border: 2px solid #2d8a4e; color: #1f5f37; }
.banner.bad { background: #fbecec; border: 2px solid #b3202a; color: #8a1820; }
.banner.warn { background: #fef9e7; border: 2px solid #b8860b; color: #6b4e06; }
.banner b { font-size: 1.15rem; display: block; }
table.meta { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
table.meta td { padding: 6px 4px; border-bottom: 1px solid #eee; vertical-align: top; }
table.meta td:first-child { font-weight: 700; color: #75787B; width: 190px; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.04em; }
.mono { font-family: 'Courier New', monospace; word-break: break-all; }
.msg { border-left: 3px solid #21145F; background: #f5f3fc; padding: 10px 14px; margin-bottom: 10px; border-radius: 0 8px 8px 0; font-size: 0.86rem; line-height: 1.6; white-space: pre-wrap; }
.msg.student { border-color: #E84B8A; background: #fff; border: 1px solid #f1d3e0; border-left: 3px solid #E84B8A; }
.msg.draft { border-color: #b8860b; background: #fef9e7; font-family: 'Courier New', monospace; font-size: 0.76rem; }
.msg .who { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.08em; color: #21145F; margin-bottom: 4px; }
.msg.student .who { color: #E84B8A; }
.pre { white-space: pre-wrap; font-size: 0.86rem; line-height: 1.6; }
.ruling { padding: 4px 0; border-bottom: 1px dotted #ddd; font-size: 0.84rem; }
@media print { header, #lookup, button { display: none !important; } .card { box-shadow: none; border: 1px solid #ddd; } }
</style>
</head>

<main>
  <div class="card" id="lookup">
    <h2>Look up a certificate</h2>
    <label for="certId">Certificate ID (from the student's PDF, e.g. EDP-7KQM-R2XH-9PTC)</label>
    <input id="certId" type="text" autocomplete="off">
    <label for="key">Instructor key</label>
    <input id="key" type="password" autocomplete="current-password">
    <div class="small">The key is the INSTRUCTOR_KEY you set on the Worker. It is remembered in this browser only.</div>
    <button onclick="lookup()">Verify</button>
  </div>
  <div id="result"></div>
</main>
<script>
const WORKER_URL = 'https://estate-tutor.harveyfiser.workers.dev';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function strip(t) { return String(t || '').replace(/\[(STAGE|ADVANCE|NEXT_EVENT|WILL_APPROVED|RULING|DOC_UPDATE|CHOICES)[^\]]*\]/g, '').replace(/\*\*/g, '').trim(); }

(function init() {
  const id = new URLSearchParams(location.search).get('id');
  if (id) document.getElementById('certId').value = id;
  try { const k = localStorage.getItem('estate_instructor_key'); if (k) document.getElementById('key').value = k; } catch (e) {}
  if (id && document.getElementById('key').value) lookup();
})();

async function lookup() {
  const certId = document.getElementById('certId').value.trim().toUpperCase();
  const key = document.getElementById('key').value;
  const out = document.getElementById('result');
  if (!certId || !key) { out.innerHTML = '<div class="banner warn"><div class="icon">⚠️</div><div><b>Enter a Certificate ID and your instructor key.</b></div></div>'; return; }
  try { localStorage.setItem('estate_instructor_key', key); } catch (e) {}
  out.innerHTML = '<div class="card">Checking...</div>';
  let data;
  try {
    const r = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'verify', certId, key }) });
    data = await r.json();
    if (r.status === 403) { out.innerHTML = '<div class="banner bad"><div class="icon">🔒</div><div><b>Instructor key not accepted.</b>Check the INSTRUCTOR_KEY secret on the Worker.</div></div>'; return; }
  } catch (e) { out.innerHTML = '<div class="banner bad"><div class="icon">⚠️</div><div><b>Could not reach the verification server.</b>' + esc(e.message) + '</div></div>'; return; }
  if (!data.found) { out.innerHTML = '<div class="banner bad"><div class="icon">❌</div><div><b>No certificate found for ' + esc(certId) + '.</b>The ID may be mistyped, invented, or older than about six months.</div></div>'; return; }

  const pk = data.package || {};
  const allOk = data.intact && data.status === 'VERIFIED';
  let html = `<div class="banner ${allOk ? 'ok' : (data.intact ? 'warn' : 'bad')}"><div class="icon">${allOk ? '✅' : '⚠️'}</div><div>
    <b>${allOk ? 'Authentic: this is the certified original.' : (data.intact ? 'Certificate found, but some tutor messages could not be verified.' : 'Stored record failed its integrity check.')}</b>
    Compare the student's PDF against the transcript below. Anything in the PDF that is not here was added after certification.</div></div>`;
  html += `<div class="card"><h2>Certificate</h2><table class="meta">
    <tr><td>Certificate ID</td><td class="mono">${esc(data.certId)}</td></tr>
    <tr><td>Status</td><td>${esc(data.status)}</td></tr>
    <tr><td>Issued</td><td>${esc(new Date(data.issuedAt).toLocaleString())}</td></tr>
    <tr><td>Tutor replies verified</td><td>${data.verified} of ${data.total}</td></tr>
    <tr><td>Feedback report signed</td><td>${data.feedbackVerified ? 'Yes' : 'No'}</td></tr>
    <tr><td>Record integrity</td><td>${data.intact ? 'Intact (fingerprint and seal match)' : 'FAILED'}</td></tr>
    <tr><td>Fingerprint</td><td class="mono">${esc(data.fingerprint)}</td></tr>
    <tr><td>Case</td><td>${esc(pk.caseLabel)} &middot; started ${esc(new Date(pk.startedAt).toLocaleString())}</td></tr>
    <tr><td>Attorney name</td><td>${esc(pk.attorney || '(not given)')}</td></tr>
    <tr><td>Case variant</td><td class="mono" style="font-size:0.76rem">${esc((pk.caseVariant && pk.caseVariant.life || []).join(', '))}<br>${esc((pk.caseVariant && pk.caseVariant.probate || []).join(', '))}</td></tr>
    <tr><td>Student messages</td><td>${(pk.history || []).filter(m => m.role === 'user' && !m.hidden).length}</td></tr>
  </table><button class="secondary" onclick="window.print()">Print this record</button></div>`;
  const rul = pk.rulings || {};
  html += `<div class="card"><h2>Rulings</h2>${Object.keys(rul).map(k => `<div class="ruling"><b>${esc(k)}</b>: ${esc(rul[k].outcome)}${rul[k].reason ? '. ' + esc(rul[k].reason) : ''}</div>`).join('') || 'None'}</div>`;
  const memo = pk.memo || {};
  html += `<div class="card"><h2>Memorandum answers</h2>
    <p><b>1. Hardest gift questions</b></p><div class="pre">${esc(memo.gifts)}</div><br>
    <p><b>2. Outside the will</b></p><div class="pre">${esc(memo.outside)}</div><br>
    <p><b>3. Drafting lessons</b></p><div class="pre">${esc(memo.drafting)}</div><br>
    <p><b>4. Reflection</b></p><div class="pre">${esc(memo.reflect)}</div></div>`;
  html += `<div class="card"><h2>AI feedback report</h2><div class="pre">${esc(pk.feedback || '(none)')}</div></div>`;
  html += `<div class="card"><h2>Will as executed</h2><div class="pre mono" style="font-size:0.78rem">${esc(pk.will)}</div></div>`;
  html += `<div class="card"><h2>Transcript</h2>${(pk.history || []).map(m => {
    if (m.role === 'user' && m.hidden && /DRAFT SUBMITTED/.test(m.content)) return `<div class="msg draft"><div class="who">WILL DRAFT SUBMITTED</div>${esc(m.content)}</div>`;
    if (m.role === 'user' && m.hidden) return '';
    if (m.role === 'user') return `<div class="msg student"><div class="who">STUDENT</div>${esc(m.content)}</div>`;
    return `<div class="msg"><div class="who">TUTOR${m.static ? ' (opening message)' : ''}</div>${esc(strip(m.content))}</div>`;
  }).join('')}</div>`;
  out.innerHTML = html;
}
</script>
</body>
</html>
